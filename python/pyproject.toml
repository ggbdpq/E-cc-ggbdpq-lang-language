[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lang-py"
version = "1.0.0"
description = "lang-go 语言的 Python 独立实现（同一门语言，同一契约）"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.scripts]
lang-go-py = "lang_py.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
