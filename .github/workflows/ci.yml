name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: gofmt check
        working-directory: impls/go
        run: test -z "$(gofmt -l .)"
      - name: go vet
        working-directory: impls/go
        run: go vet ./...
      - name: golangci-lint（仅新增问题）
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          only-new-issues: true
          working-directory: impls/go
      - name: go test
        working-directory: impls/go
        run: go test ./... -count=1

  typescript-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: impls/typescript
        run: npm install 2>/dev/null || true
      - name: Type check
        working-directory: impls/typescript
        run: npx tsc -p tsconfig.json --noEmit
      - name: Build
        working-directory: impls/typescript
        run: npm run build

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: cargo fmt
        working-directory: impls/rust
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: impls/rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test（含 conformance 151×4 与双后端 E2E，go/node 差分依赖上方 setup）
        working-directory: impls/rust
        run: cargo test --workspace

  csharp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: dotnet build
        working-directory: impls/csharp
        run: dotnet build LangCs.slnx -c Release -warnaserror
      - name: dotnet test（含 conformance 151×4 与双后端 E2E，go/node 差分依赖上方 setup）
        working-directory: impls/csharp
        run: dotnet test -c Release
      - name: dotnet format
        working-directory: impls/csharp
        run: dotnet format --verify-no-changes

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pytest + lang-py（editable）
        run: |
          pip install pytest
          pip install -e impls/python
      - name: pytest（conformance + 差分，go/node 依赖上方 setup）
        working-directory: impls/python
        run: pytest tests -q

  conformance-go:
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build CLI
        working-directory: impls/go
        run: go build -o lang-go ./cmd/lang-go
      - name: Run conformance suite
        working-directory: impls/go
        run: go test ./internal/conformance/ -count=1 -v

  dogfood:
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build CLI
        working-directory: impls/go
        run: go build -o /tmp/lang-go ./cmd/lang-go
      - name: langalgo test
        working-directory: dogfood/langalgo
        run: /tmp/lang-go test

  release:
    runs-on: ubuntu-latest
    needs: [go-test, conformance-go, dogfood]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build release binaries
        run: |
          cd impls/go
          GOOS=windows GOARCH=amd64 go build -o ../release/lang-go-windows-amd64.exe ./cmd/lang-go
          GOOS=linux GOARCH=amd64 go build -o ../release/lang-go-linux-amd64 ./cmd/lang-go
          GOOS=darwin GOARCH=arm64 go build -o ../release/lang-go-darwin-arm64 ./cmd/lang-go
      - name: Generate SHA256
        run: |
          cd release
          sha256sum * > SHA256SUMS
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: release/
