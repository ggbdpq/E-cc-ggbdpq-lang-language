name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: gofmt check
        working-directory: go
        run: test -z "$(gofmt -l .)"
      - name: go vet
        working-directory: go
        run: go vet ./...
      - name: go test
        working-directory: go
        run: go test ./... -count=1

  typescript-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: typescript
        run: npm install 2>/dev/null || true
      - name: Type check
        working-directory: typescript
        run: npx tsc -p tsconfig.json --noEmit
      - name: Build
        working-directory: typescript
        run: npm run build

  conformance-go:
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build CLI
        working-directory: go
        run: go build -o lang-go ./cmd/lang-go
      - name: Run conformance suite
        working-directory: go
        run: go test ./internal/conformance/ -count=1 -v

  dogfood:
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build CLI
        working-directory: go
        run: go build -o /tmp/lang-go ./cmd/lang-go
      - name: langalgo test
        working-directory: dogfood/langalgo
        run: /tmp/lang-go test

  release:
    runs-on: ubuntu-latest
    needs: [go-test, conformance-go, dogfood]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build release binaries
        run: |
          cd go
          GOOS=windows GOARCH=amd64 go build -o ../release/lang-go-windows-amd64.exe ./cmd/lang-go
          GOOS=linux GOARCH=amd64 go build -o ../release/lang-go-linux-amd64 ./cmd/lang-go
          GOOS=darwin GOARCH=arm64 go build -o ../release/lang-go-darwin-arm64 ./cmd/lang-go
      - name: Generate SHA256
        run: |
          cd release
          sha256sum * > SHA256SUMS
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: release/
